name: Build release artifacts

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag storf-reporter:${GITHUB_REF_NAME} .
      - run: docker run --rm storf-reporter:${GITHUB_REF_NAME} --version

# Publishing is intentionally separate from building. Add a trusted PyPI
# publishing environment only after the release-candidate checklist is signed.
