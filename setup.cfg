[metadata]
name = StORF-Reporter
version = attr: StORF_Reporter.constants.__version__
author = Nicholas Dimonaco
author_email = nicholas@dimonaco.co.uk
license = GPL-3.0-or-later
description = Discover and prioritise stop-to-stop ORF candidates in unannotated prokaryotic genome regions.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/NickJD/StORF-Reporter
project_urls =
    Bug Tracker = https://github.com/NickJD/StORF-Reporter/issues
    Documentation = https://github.com/NickJD/StORF-Reporter#readme
    Publication = https://doi.org/10.1093/nar/gkad814
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Topic :: Scientific/Engineering :: Bio-Informatics
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
zip_safe = False

install_requires =
    pyrodigal>=3,<4

[options.extras_require]
test =
    pytest>=8,<10
dev =
    pytest>=8,<10
    ruff>=0.12,<1
    build>=1,<2


[options.packages.find]
where = src
include = *


[options.entry_points]
console_scripts =
    storf = StORF_Reporter.cli:main
    StORF = StORF_Reporter.cli:main
    STORF = StORF_Reporter.cli:main
    StORF-Reporter = StORF_Reporter.StORF_Reporter:main
    storf-reporter = StORF_Reporter.StORF_Reporter:main
    StORF-Finder = StORF_Reporter.StORF_Finder:main
    storf-finder = StORF_Reporter.StORF_Finder:main
    UR-Extractor = StORF_Reporter.UR_Extractor:main
    ur-extractor = StORF_Reporter.UR_Extractor:main
    StORF-Extractor = StORF_Reporter.StORF_Extractor:main
    storf-extractor = StORF_Reporter.StORF_Extractor:main
    StORF-Remover = StORF_Reporter.StORF_Remover:main
    storf-remover = StORF_Reporter.StORF_Remover:main
    storf-add = StORF_Reporter.Tools.StORF_Adder:main
    storf-uncovered = StORF_Reporter.Tools.Un_StORFed:main
    storf-lengths = StORF_Reporter.Tools.UR_Lenghts:main
